version: "3.9"

services:
  ui_service:
    build: .
    container_name: ui_service
    networks:
      - test_network
    restart: unless-stopped
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  test_network:
    external: true
